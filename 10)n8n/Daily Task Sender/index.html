<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Daily Task Automation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      background: #f8fafc;
      color: #1f2937;
    }

    header {
      padding: 20px 40px;
      border-bottom: 1px solid #e5e7eb;
      background: white;
    }

    header h1 {
      font-size: 20px;
    }

    .hero {
      text-align: center;
      padding: 40px 20px 20px;
    }

    .hero h2 {
      font-size: 26px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #6b7280;
      font-size: 15px;
      max-width: 500px;
      margin: auto;
    }

    .features {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 30px 0;
      flex-wrap: wrap;
    }

    .feature {
      background: white;
      padding: 15px 20px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      font-size: 14px;
    }

    .container {
      display: flex;
      justify-content: center;
      margin-bottom: 50px;
    }

    .form-card {
      background: white;
      padding: 25px;
      border-radius: 10px;
      width: 360px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.05);
      border: 1px solid #e5e7eb;
    }

    h3 {
      text-align: center;
      margin-bottom: 15px;
    }

    label {
      font-size: 13px;
      margin-bottom: 4px;
      display: block;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 14px;
      border-radius: 6px;
      border: 1px solid #d1d5db;
    }

    button {
      width: 100%;
      padding: 11px;
      background: #111827;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #1f2937;
    }

    button:disabled {
      background: #9ca3af;
    }

    .message {
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
    }

    .success { color: #16a34a; }
    .error { color: #dc2626; }
  </style>
</head>

<body>

<header>
  <h1>📋 Daily Task Automation</h1>
</header>

<section class="hero">
  <h2>Automate Your Daily Productivity</h2>
  <p>
    Add users to receive personalized daily tasks automatically based on their role.
    Our system uses AI to generate relevant tasks and sends them via email every day.
  </p>
</section>



<div class="container">
  <div class="form-card">
    <h3>Add New User</h3>

    <form id="userForm">
      <label>Name</label>
      <input type="text" name="name" required>

      <label>Email</label>
      <input type="email" name="email" required>

      <label>Role</label>
      <input type="text" name="role" placeholder="e.g. Developer, Designer" required>

      <button type="submit" id="btn">Add User</button>
    </form>

    <p id="msg" class="message"></p>
  </div>
</div>

<script>
  const form = document.getElementById("userForm");
  const msg = document.getElementById("msg");
  const btn = document.getElementById("btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    btn.disabled = true;
    btn.innerText = "Adding...";

    const data = {
      name: form.name.value,
      email: form.email.value,
      role: form.role.value
    };

    try {
      msg.className = "message success";
      msg.innerText = "Adding user...";

      await fetch("http://localhost:5678/webhook/add-user", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
      });

      msg.innerText = "✅ User added successfully!";
      form.reset();

    } catch (err) {
      msg.className = "message error";
      msg.innerText = "❌ Failed to add user!";
    }

    btn.disabled = false;
    btn.innerText = "Add User";
  });
</script>

</body>
</html>
